name: Tapes
options:
  bundleIdPrefix: co.alfajor
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  GridKit:
    path: Packages/GridKit
  TapeEngine:
    path: Packages/TapeEngine
targets:
  Tapes:
    type: application
    platform: iOS
    sources: [Tapes, Shared]
    # Keys the build settings cannot express. Merged with the generated Info.plist.
    info:
      path: Tapes/Info.plist
      properties:
        UIBackgroundModes: [audio]
    dependencies:
      - package: GridKit
      - package: TapeEngine
      - target: TapesLive
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 49MWCX22SN
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: co.alfajor.tapes
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Vibe Tapes
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Vibe Tapes records the microphone, or an instrument you plug in, onto the selected tape track.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  TapesLive:
    type: app-extension
    platform: iOS
    sources:
      - TapesLive
      - Shared
      - path: Tapes/Fonts
        includes: ["GeistMono-*.otf"]
    info:
      path: TapesLive/Info.plist
      properties:
        CFBundleDisplayName: Vibe Tapes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [GeistMono-Light.otf, GeistMono-Regular.otf, GeistMono-Medium.otf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 49MWCX22SN
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: co.alfajor.tapes.live
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: 3
        SKIP_INSTALL: YES
  TapesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TapesUITests]
    dependencies:
      - target: Tapes
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 49MWCX22SN
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: co.alfajor.tapes.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tapes
schemes:
  Tapes:
    build:
      targets:
        Tapes: all
        TapesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [TapesUITests]
